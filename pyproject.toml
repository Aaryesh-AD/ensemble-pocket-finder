[project]
name = "ensemble-emulation"
version = "0.1.0"
description = "Ensemble pocket detection using BioEMU conformational ensembles and a graph attention network."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bioemu>=1.2.0",
    "biopython>=1.87",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "mdanalysis>=2.10.0",
    "networkx>=3.6.1",
    "nglview>=4.0.1",
    "numpy>=2.4.6",
    "openmm>=8.5.1",
    "pandas>=3.0.3",
    "py3dmol>=2.5.5",
    "rdkit>=2026.3.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioemu_pocket"]

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]
